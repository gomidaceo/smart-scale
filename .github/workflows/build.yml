name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build release APK
        shell: bash
        run: |
          set -o pipefail
          gradle :app:assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Publish release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk smart-scale.apk
          gh release delete latest -y --cleanup-tag || true
          gh release create latest smart-scale.apk \
            --title "내 체중계 v1.0.${{ github.run_number }}" \
            --notes "폰에서 smart-scale.apk 를 눌러 내려받아 설치하세요."

      - name: Save build log on failure
        if: failure()
        run: |
          git config user.name "build-bot"
          git config user.email "build-bot@users.noreply.github.com"
          tail -c 80000 build.log > /tmp/LOG.txt || echo "no log" > /tmp/LOG.txt
          git checkout --orphan build-log
          git rm -rf --cached . > /dev/null
          cp /tmp/LOG.txt LOG.txt
          git add LOG.txt
          git commit -m "build log ${{ github.run_number }}"
          git push -f origin build-log
