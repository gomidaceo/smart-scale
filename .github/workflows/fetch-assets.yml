name: Fetch design assets

on:
  push:
    branches: [main]
    paths: ["design-assets/urls.txt"]

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download
        run: |
          cd design-assets
          while read -r name url; do
            [ -z "$name" ] && continue
            [ -f "$name" ] || curl -sSfL -o "$name" "$url"
          done < urls.txt
          ls -l
      - name: Commit
        run: |
          git config user.name "build-bot"
          git config user.email "build-bot@users.noreply.github.com"
          git add design-assets
          git diff --cached --quiet || git commit -m "디자인 이미지 저장 [skip ci]"
          git push
